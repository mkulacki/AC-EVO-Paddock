# Checks every push and pull request: the syntax of every shipped script and the test suite.
# Tests need no credentials, no network service, no AI key and no running game: every test uses scratch data dirs
# (test/helpers.js). The packaged-app smoke test (npm run smoke:packaged) is not run here: it needs a build and
# port 8080, and is part of the release checklist instead.
name: CI

on:
  # pushes to main, and pull requests (a branch with a PR is checked once, through the PR)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # the app ships for Windows only: the whole suite on Node 22 and on Electron's own Node (the packaged runtime), and the browser flows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Tests on Electron's Node
        run: npm run test:electron
      - name: Browser flows (headless Edge, preinstalled on windows-latest)
        run: npm run test:browser

  ubuntu:
    # Every test file except the Windows-only ones, which are listed with their reasons in test/portable.js
    # (WINDOWS_ONLY: smoke, mods, appmgmt, secrets, feedback). New test files are included automatically.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Platform-neutral tests
        run: node test/portable.js
