<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paddock HUD</title>
  <!-- The in-game app (mod/trainerhud) running outside the game: desktop overlay or a second screen. -->
  <link rel="stylesheet" href="/mod/trainerhud.css">
  <style>
    :root { --font-family-main: "Bahnschrift", "Segoe UI", Arial, sans-serif; font-size: 18px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: #fff; font-family: var(--font-family-main); }
    body.page { background: #101214; }
    /* backgrounds for the preview in Settings (?bg=light|track) */
    body.page.bg-light { background: #f4f5f7; }
    body.page.bg-track { background: linear-gradient(180deg, #7d9cba 0%, #b9cad8 40%, #6b7560 41%, #49503f 58%, #2e3033 59%, #1f2022 100%); }
    .ace-trainerhud { left: 24px; top: 24px; user-select: none; }
  </style>
</head>
<body>
  <div id="trainerhud"></div>
  <script>
    if (!window.trainerOverlay) document.body.classList.add('page');
    // the preview in Settings: smaller, in the corner of its frame, over the chosen background
    if (/[?&]demo\b/.test(location.search)) document.documentElement.style.fontSize = '14px';
    const bg = (location.search.match(/[?&]bg=(light|track)\b/) || [])[1];
    if (bg) document.body.classList.add('bg-' + bg);
  </script>
  <script src="/mod/trainerhud.js"></script>
</body>
</html>
