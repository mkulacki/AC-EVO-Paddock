<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC EVO Paddock</title>
  <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/style.css">
  <meta name="theme-color" content="#15181c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4 1h12l-4 14H0z' fill='%23c8ff1e'/><path d='M3.5 11l3-6 2 4 1.5-2L12 11' stroke='%230b0e05' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <script>try { if (localStorage.getItem('side.collapsed') === '1') document.documentElement.classList.add('side-collapsed'); } catch { /* private mode */ }</script>
  <script>
    // theme: 'system' (default, follows Windows), 'dark' or 'light' (Settings > Theme). Set before first paint, no flash.
    (() => {
      const os = matchMedia('(prefers-color-scheme: light)');
      const apply = () => {
        let pick = 'system';
        try { pick = localStorage.getItem('theme') || 'system'; } catch { /* private mode */ }
        const t = pick === 'system' ? (os.matches ? 'light' : 'dark') : pick;
        document.documentElement.dataset.theme = t;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = t === 'light' ? '#eef0f2' : '#15181c';
      };
      os.addEventListener('change', apply);
      window.applyTheme = apply;
      apply();
    })();
  </script>
</head>
<body>
  <aside class="side" aria-label="Paddock">
    <a class="brand" href="#/home" title="AC EVO Paddock: home"><span class="mark"><svg viewBox="0 0 16 16"><path d="M3 11.5l3.2-7 2.3 4.6 1.6-2.3 2.9 4.7" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-txt">AC EVO Paddock</span></a>
    <button class="side-search" id="openPalette" title="Search and commands (Ctrl+K)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><span class="lbl">Search</span><kbd>Ctrl K</kbd></button>
    <nav aria-label="Pages">
      <a href="#/home" data-nav="home" title="Home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6"/><path d="M5 8v8.5h10V8"/><path d="M8.5 16.5v-4h3v4"/></svg><span class="lbl">Home</span></a>
      <a href="#/race" data-nav="race" title="Race"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 18V3"/><path d="M5 3.5h10l-2 3.5 2 3.5H5"/></svg><span class="lbl">Race</span></a>
      <a href="#/" data-nav="laps" title="Sessions"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="6.5"/><path d="M10 11V7.5M8 2.5h4M15 5.5l1.2-1.2"/></svg><span class="lbl">Sessions</span></a>
      <a href="#/development" data-nav="development" title="Development"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8v4a4 4 0 0 1-8 0z"/><path d="M6 4.5H3.5a2.5 2.5 0 0 0 2.6 3M14 4.5h2.5a2.5 2.5 0 0 1-2.6 3"/><path d="M10 11v3.5M7 17h6M8 14.5h4V17H8z"/></svg><span class="lbl">Development</span></a>
      <a href="#/leaderboard" data-nav="leaderboard" title="Leaderboards"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 17V8.5h5V17"/><path d="M2.5 17v-5h5M12.5 17v-6.5h5V17"/><path d="M1.5 17h17"/></svg><span class="lbl">Leaderboards</span></a>
      <a href="#/tracks" data-nav="tracks" title="Tracks"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16c-2-3 0-6 3-6h6c3 0 4-3 2-5.5S9 2 7.5 4.5"/><circle cx="15" cy="16" r="1.6"/></svg><span class="lbl">Tracks</span></a>
      <a href="#/cars" data-nav="cars" title="Cars"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 13.5v-2.2l1.6-3.8A1.5 1.5 0 0 1 6 6.5h8a1.5 1.5 0 0 1 1.4 1l1.6 3.8v2.2z"/><path d="M3 11.3h14"/><circle cx="6.2" cy="14.5" r="1.5"/><circle cx="13.8" cy="14.5" r="1.5"/></svg><span class="lbl">Cars</span></a>
      <a href="#/setups" data-nav="setups" title="Setups"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3v14M10 3v14M16 3v14"/><path d="M2.5 7h3M8.5 12h3M14.5 6h3"/></svg><span class="lbl">Setups</span></a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/game" data-nav="game" title="Game"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="6" width="15" height="9" rx="4"/><path d="M6.5 9v3M5 10.5h3"/><circle cx="13" cy="9.5" r=".6"/><circle cx="14.5" cy="11.5" r=".6"/></svg><span class="lbl">Game</span></a>
      <a href="#/mods" data-nav="mods" title="Mods"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5z"/><path d="M3 6.5l7 3.5 7-3.5M10 10v7"/></svg><span class="lbl">Mods</span></a>
      <a href="#/settings" data-nav="settings" title="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg><span class="lbl">Settings</span></a>
    </nav>
    <div class="side-foot">
      <a class="side-kofi" href="https://ko-fi.com/kulyk" target="_blank" rel="noopener" title="Paddock is free and made in spare time. If it helps you find time on track, a coffee on Ko-fi keeps it going. Thank you!">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5h10v4.5a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z"/><path d="M13.5 8.5h1.2a2.3 2.3 0 0 1 0 4.6h-1.5"/><path d="M8.5 12.2 6.9 10.7a1 1 0 0 1 1.6-1.2 1 1 0 0 1 1.6 1.2z"/></svg>
        <span class="lbl"><b>Enjoying Paddock?</b><span>Thanks for driving with it! Buy me a coffee on Ko-fi</span></span></a>
      <button class="assist-btn" id="assistBtn" type="button" aria-pressed="false" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="5.5" width="15" height="9" rx="2"/><path d="M6 10h8"/></svg><span class="lbl">HUD and cues on</span></button>
      <div class="status" id="status" role="status"><span class="dot"></span><span class="txt">Connecting to Paddock…</span></div>
      <div class="side-tools">
        <button class="ghost small" id="openShortcuts" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
        <button class="ghost small" id="sideToggle" title="Collapse the sidebar" aria-label="Collapse the sidebar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 5l-5 5 5 5"/></svg></button>
      </div>
    </div>
  </aside>
  <main id="view"></main>
  <script src="/vendor/uplot/uPlot.iife.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
